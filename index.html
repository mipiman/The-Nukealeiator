<!-- Pixel LCD font -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
   

<div class="calculator">

    <div class="brand">
        <span class="casio">CASIO</span>
        <span class="model">fx-991EX</span>
    </div>

    <div class="display lcd" id="display">0</div>

    <div class="buttons">
        <button class="clear">AC</button>
        <button>(</button>
        <button>)</button>
        <button>xʸ</button>
        <button>÷</button>

        <button id="frac-btn">FRAC</button>

        <button>√</button>
        <button>×</button>
        <button>y√x</button> <!-- ✅ CUSTOM ROOT -->
        <button>x²</button>

        <button>−</button>
        <button>+</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>

        <button>π</button>
        <button>⌫</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>

        <button>%</button>
        <button>=</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>

        <button class="zero">0</button>
        <button>.</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
